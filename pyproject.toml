[project]
name = "daedalus"
version = "0.1.0"
description = "Framework to detect inefficiencies and rent-seeking in economic systems"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
license = "MIT"
dependencies = [
    "pandas",
    "networkx",
    "numpy",
    "matplotlib",
    "scipy",
    "cvxpy"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
